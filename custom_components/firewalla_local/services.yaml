get_time_usage_report:
  name: Get time usage report
  description: Return one normalized scoped time-usage report from the Firewalla local API.
  fields:
    host_mac:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text: {}
      name: Host MAC
      description: Optional. Scope the report to a host by MAC. Provide exactly one scope selector.
    host_name:
      required: false
      example: "Living Room TV"
      selector:
        text: {}
      name: Host name
      description: Optional. Scope the report to a host by name. Provide exactly one scope selector.
    group_id:
      required: false
      example: "53"
      selector:
        text: {}
      name: Group ID
      description: Optional. Scope the report to a group by id. Provide exactly one scope selector.
    group_name:
      required: false
      example: "Guest Devices"
      selector:
        text: {}
      name: Group name
      description: Optional. Scope the report to a group by name. Provide exactly one scope selector.
    user_id:
      required: false
      example: "63"
      selector:
        text: {}
      name: User ID
      description: Optional. Scope the report to a user by id. Provide exactly one scope selector.
    user_name:
      required: false
      example: "KADEN"
      selector:
        text: {}
      name: User name
      description: Optional. Scope the report to a user by name. Provide exactly one scope selector.
    begin:
      required: true
      example: "2026-03-20 00:00:00"
      selector:
        datetime: {}
      name: Begin
      description: Required. Local date and time for the beginning of the usage window.
    end:
      required: true
      example: "2026-03-27 00:00:00"
      selector:
        datetime: {}
      name: End
      description: Required. Local date and time for the end of the usage window.
    granularity:
      required: true
      example: "day"
      selector:
        select:
          options:
            - "day"
            - "hour"
      name: Granularity
      description: Required. Choose whether the primary report periods should be daily or hourly.
    sections:
      required: false
      example: "apps,categories"
      selector:
        select:
          multiple: true
          options:
            - value: "internet"
              label: Internet usage
            - value: "app_totals"
              label: App totals
            - value: "apps"
              label: Apps
            - value: "categories"
              label: Categories
      name: Sections
      description: Optional. Limit the report to the named major sections. When omitted, standard returns all major sections and summary returns internet plus app totals. A non-empty app filter also keeps the apps section visible.
    include:
      required: false
      example: "intervals"
      selector:
        select:
          multiple: true
          options:
            - value: "intervals"
              label: Device interval detail
      name: Include detail
      description: Optional. Add per-device interval detail when Firewalla returns it for the selected scope and apps.
    detail:
      required: false
      example: "full"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary
            - value: "full"
              label: Full
      name: Detail
      description: Optional. Defaults to full. Summary returns the smallest default section set, while full returns the normal report depth.
    app_ids:
      required: false
      example: "internet,facebook"
      selector:
        text: {}
      name: App IDs
      description: Optional. Provide a comma-separated list in the UI, or a list in YAML. Omit this field to return all available app sections. A non-empty list also keeps the apps section in the response.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text: {}
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text: {}
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_wan_data_usage:
  name: Get WAN data usage
  description: Return one normalized WAN data-usage report with current and history month, week, and day sections.
  fields:
    wan_uuid:
      required: false
      example: "b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter results to one WAN UUID.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter results to one WAN display name.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before reading current WAN data.
    current_periods:
      required: false
      example: "month"
      selector:
        select:
          multiple: true
          options:
            - value: "month"
              label: Current month
            - value: "week"
              label: Current week
            - value: "day"
              label: Current day
      name: Current periods
      description: Optional. Defaults to current month unless you request only history.
    history_period:
      required: false
      example: "month"
      selector:
        select:
          options:
            - value: "month"
              label: Months
            - value: "week"
              label: Weeks
            - value: "day"
              label: Days
      name: History period
      description: Optional. Required when history count is greater than zero.
    history_count:
      required: false
      example: 3
      selector:
        number:
          min: 0
          max: 366
      name: History count
      description: Optional. Number of full history periods to include. Defaults to 0. Historical periods are always full periods.
    include:
      required: false
      example: "subperiods"
      selector:
        select:
          multiple: true
          options:
            - value: "history"
              label: History rows
            - value: "subperiods"
              label: Nested subperiod breakdowns
      name: Include sections
      description: Optional. Add history rows or nested subperiod breakdowns where the selected periods support them.
    detail:
      required: false
      example: "summary"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary
            - value: "full"
              label: Full
      name: Detail
      description: Optional. Defaults to summary. Use full only when you want nested subperiod breakdowns where the selected periods support them.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_wan_events:
  name: Get WAN events
  description: Return normalized WAN health timeline events from the Firewalla local API.
  fields:
    wan_uuid:
      required: false
      example: "b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter events to one WAN UUID when the event applies to that WAN.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter events to one WAN display name.
    limit:
      required: false
      example: 100
      selector:
        number:
          min: 1
          max: 500
          mode: box
      name: Event limit
      description: Optional. Defaults to 100. Firewalla app captures confirmed paged reads through limit_count.
    offset:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 5000
          mode: box
      name: Event offset
      description: Optional. Defaults to 0 so you can page older events.
    window_days:
      required: false
      example: 7
      selector:
        number:
          min: 0
          max: 366
          mode: box
      name: Window (days)
      description: Optional. How many days back to look. Defaults to 7; use 0 for no time bound. Unlike the alarm reads, this time filter is genuinely honoured.
    include_dns:
      required: false
      example: false
      selector:
        boolean:
      name: Include DNS probes
      description: Optional. Defaults to false. The box's internal DNS health probes run roughly every 3 minutes and are not WAN events, so they are excluded by default.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

pause_rule:
  name: Pause rule
  description: Pause a managed Firewalla rule. Provide either a duration or a resume time. If you provide neither, the rule stays paused until resumed.
  fields:
    rule_id:
      required: true
      example: "100"
      selector:
        text:
      name: Rule ID
      description: Use the rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
    duration:
      required: false
      example: "30m"
      selector:
        text:
      name: Duration
      description: Optional. How long to pause the rule, for example 30m, 4h, or 2d 4h 30m.
    resume_at:
      required: false
      example: "2026-03-24 18:30:00"
      selector:
        datetime:
      name: Resume at
      description: Optional. Local date and time when the rule should resume.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

resume_rule:
  name: Resume rule
  description: Resume a managed Firewalla rule immediately.
  fields:
    rule_id:
