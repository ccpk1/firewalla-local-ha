      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

set_ssid_paused:
  name: Set SSID paused
  description: Pause or resume one AP7 wireless network (SSID profile). Uses the confirmed local write contract to toggle the wireless network across all AP7 access points.
  fields:
    ssid_profile_id:
      required: true
      example: "c3d4e5f6-a7b8-4c9d-8e1f-2a3b4c5d6e7f"
      selector:
        text:
      name: SSID profile
      description: The UUID or SSID name of the wireless network to toggle. Get the list from the get_wireless_status service.
    enabled:
      required: true
      example: true
      selector:
        boolean:
      name: Enabled
      description: Set to true to enable (unpause) the wireless network, or false to pause it.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_alarms:
  name: Get alarms
  description: Return the newest active alarms and optionally archived alarms with normalized details, silence records, and shared report metadata. The box retains roughly 30 days and provides no time-window or cursor filter.
  fields:
    limit:
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 500
          mode: box
      name: Limit
      description: Optional. Defaults to 10. Return the newest matching alarms, up to 500.
    include_archived:
      required: false
      example: false
      selector:
        boolean:
      name: Include archived
      description: Optional. Include archived alarm records.
    alarm_type:
      required: false
      example: "security"
      selector:
        text:
      name: Alarm type
      description: Optional. Filter by alarm type. A raw ALARM_* value or a
        supported group (security, abnormal_upload, or open_port). Matches the
        alarm_type field on the returned records.
    include_exceptions:
      required: false
      example: false
      selector:
        boolean:
      name: Include silence records
      description: Optional. Add the full silence-exception table. Defaults to
        false; each alarm already carries its exception_id. Set this only to
        find a silence to unmute.
    detail:
      required: false
      example: false
      selector:
        boolean:
      name: Fetch detail
      description: Optional. Fetch extended detail with one additional request per returned alarm.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if names are unique. If names repeat, use Config Entry ID.

get_rules:
  name: Get rules
  description: Return the current live policy rules as a flat, selectable list with rule id, action, enabled and paused state, target, scope, applies_to, tag_refs, purpose, and any originating alarm. Defaults to user-visible rules — product-owned DAP and family rules, and rules owned by a Firewalla subsystem, are hidden unless requested via include_purpose or include_system_managed. Use this to resolve the rule target for pause_rule and resume_rule.
  fields:
    enabled:
      required: false
      example: true
      selector:
        boolean:
      name: Enabled
      description: Optional. Filter by enabled state.
    action:
      required: false
      example: "block"
      selector:
        select:
          options:
            - value: "block"
              label: Block
            - value: "allow"
              label: Allow
            - value: "qos"
              label: QoS
            - value: "disturb"
              label: Disturb
      name: Action
      description: Optional. Filter by rule action.
    target_type:
      required: false
      example: "category"
      selector:
        text:
      name: Target type
      description: Optional. Filter by target type, for example category, mac, ip, dns or network.
    applies_to:
      required: false
      example: "Kids Devices"
      selector:
        text:
      name: Applies to
      description: Optional. Filter to rules governing one group, user or network name.
    include_purpose:
      required: false
      example: "dap"
      selector:
        select:
          multiple: true
          options:
            - value: "dap"
              label: Device Active Protect rules
            - value: "family"
              label: Family rules
      name: Include purpose
      description: Optional. Include product-owned rules that are hidden by default.
    include_system_managed:
      required: false
      example: true
      selector:
        boolean:
      name: Include system-managed
      description: Optional. Include rules owned by a Firewalla subsystem, such as alarm-intel auto-blocks. Hidden by default with the product-owned purposes.
    config_entry_id:
      required: false
