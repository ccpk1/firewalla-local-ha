get_runtime_inventory:
  name: Get rule and runtime inventory
  description: Return the current Firewalla rule, group, user, and related runtime inventory as structured data plus a markdown summary.
  fields:
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_host_name_mapping:
  name: Get host name mapping
  description: Return the current Firewalla host identity records with explicit normalized host naming fields, IP address, host device type, and host kind.
  fields:
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before building the host identity records.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_network_segment_report:
  name: Get network segment report
  description: Return one configuration-oriented network segment report in the shared report envelope from the Firewalla local API.
  fields:
    network_uuid:
      required: false
      example: "5799d896-5e0f-40a5-a776-38a5d7746204"
      selector:
        text:
      name: Network UUID
      description: Required unless you provide network name. Use the Firewalla network UUID for deterministic automations.
    network_name:
      required: false
      example: "VLAN10 CORE"
      selector:
        text:
      name: Network name
      description: Required unless you provide network UUID. Use the current Firewalla network display name for interactive use.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the network selector and building the report.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_network_segment_usage:
  name: Get network segment usage
  description: Return one window-selected usage-oriented network segment report in the shared report envelope from the Firewalla local API.
  fields:
    network_uuid:
      required: false
      example: "5799d896-5e0f-40a5-a776-38a5d7746204"
      selector:
        text:
      name: Network UUID
      description: Optional. Use the Firewalla network UUID for deterministic automations. If omitted for a static reservation, the integration will try to infer the network from the reserved IPv4 address.
    network_name:
      required: false
      example: "VLAN10 CORE"
      selector:
        text:
      name: Network name
      description: Optional. Use the current Firewalla network display name for interactive use. If omitted for a static reservation, the integration will try to infer the network from the reserved IPv4 address.
    window:
      required: true
      example: "last_24_hours"
      selector:
        select:
          options:
            - value: "last_60_minutes"
              label: Last 60 minutes
            - value: "last_24_hours"
              label: Last 24 hours
            - value: "last_30_days"
              label: Last 30 days
            - value: "last_12_months"
              label: Last 12 months
      name: Window
      description: Required. Choose the primary activity window to report.
    top_n:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 100
          mode: box
      name: Top N rankings
      description: Optional. Defaults to 5. Limit how many top device, app, category, upload, and download ranking rows the report returns.
    include:
      required: false
      example: "series"
      selector:
        select:
          multiple: true
          options:
            - value: "series"
              label: Raw metric samples
      name: Include sections
      description: Optional. Add raw metric sample sections for the selected window. The default report already includes selected-window summaries plus activity-derived devices, apps, and categories when Firewalla exposes them.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the network selector and building the report.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

