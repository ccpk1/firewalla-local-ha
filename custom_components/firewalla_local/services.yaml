      example: "EC:0D:51:CC:BA:BC"
      selector:
        text: {}
      name: Scope target
      description: Required. Use a stable ID or the current display label for the selected scope.
    begin:
      required: true
      example: "2026-03-20 00:00:00"
      selector:
        datetime: {}
      name: Begin
      description: Required. Local date and time for the beginning of the usage window.
    end:
      required: true
      example: "2026-03-27 00:00:00"
      selector:
        datetime: {}
      name: End
      description: Required. Local date and time for the end of the usage window.
    granularity:
      required: true
      example: "day"
      selector:
        select:
          options:
            - "day"
            - "hour"
      name: Granularity
      description: Required. Choose whether the primary report periods should be daily or hourly.
    sections:
      required: false
      example: "apps,categories"
      selector:
        select:
          multiple: true
          options:
            - value: "internet"
              label: Internet usage
            - value: "app_totals"
              label: App totals
            - value: "apps"
              label: Apps
            - value: "categories"
              label: Categories
      name: Sections
      description: Optional. Limit the report to the named major sections. When omitted, standard returns all major sections and summary returns internet plus app totals. A non-empty app filter also keeps the apps section visible.
    include:
      required: false
      example: "intervals"
      selector:
        select:
          multiple: true
          options:
            - value: "intervals"
              label: Device interval detail
      name: Include detail
      description: Optional. Add per-device interval detail when Firewalla returns it for the selected scope and apps.
    detail:
      required: false
      example: "standard"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary
            - value: "standard"
              label: Standard
      name: Detail
      description: Optional. Defaults to standard. Summary returns the smallest default section set, while standard returns the normal report depth.
    app_ids:
      required: false
      example: "internet,facebook"
      selector:
        text: {}
      name: App IDs
      description: Optional. Provide a comma-separated list in the UI, or a list in YAML. Omit this field to return all available app sections. A non-empty list also keeps the apps section in the response.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text: {}
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text: {}
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_wan_data_usage:
  name: Get WAN data usage
  description: Return one normalized WAN data-usage report with current and history month, week, and day sections.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter results to one WAN UUID.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter results to one WAN display name.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before reading current WAN data.
    current_periods:
      required: false
      example: "month"
      selector:
        select:
          multiple: true
          options:
            - value: "month"
              label: Current month
            - value: "week"
              label: Current week
            - value: "day"
              label: Current day
      name: Current periods
      description: Optional. Defaults to current month unless you request only history.
    history_period:
      required: false
      example: "month"
      selector:
        select:
          options:
            - value: "month"
              label: Months
            - value: "week"
              label: Weeks
            - value: "day"
              label: Days
      name: History period
      description: Optional. Required when history count is greater than zero.
    history_count:
      required: false
      example: 3
      selector:
        number:
          min: 0
          max: 366
      name: History count
      description: Optional. Number of full history periods to include. Defaults to 0. Historical periods are always full periods.
    include:
      required: false
      example: "subperiods"
      selector:
        select:
          multiple: true
          options:
            - value: "history"
              label: History rows
            - value: "subperiods"
              label: Nested subperiod breakdowns
      name: Include sections
      description: Optional. Add history rows or nested subperiod breakdowns where the selected periods support them.
    detail:
      required: false
      example: "summary"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary
            - value: "full"
              label: Full
      name: Detail
      description: Optional. Defaults to summary. Use full only when you want nested subperiod breakdowns where the selected periods support them.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_wan_events:
  name: Get WAN events
  description: Return normalized WAN health timeline events from the Firewalla local API.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter events to one WAN UUID when the event applies to that WAN.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter events to one WAN display name.
    limit:
      required: false
      example: 100
      selector:
        number:
          min: 1
          max: 500
          mode: box
      name: Event limit
      description: Optional. Defaults to 100. Firewalla app captures confirmed paged reads through limit_count.
    offset:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 5000
          mode: box
      name: Event offset
      description: Optional. Defaults to 0 so you can page older events.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

pause_rule:
  name: Pause rule
  description: Pause a managed Firewalla rule. Provide either a duration or a resume time. If you provide neither, the rule stays paused until resumed.
  fields:
    rule_target:
      required: true
      example: "761"
      selector:
        text:
      name: Rule target
      description: Use the Rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
    duration:
      required: false
      example: "30m"
      selector:
        text:
      name: Duration
      description: Optional. How long to pause the rule, for example 30m, 4h, or 2d 4h 30m.
    resume_at:
      required: false
      example: "2026-03-24 18:30:00"
      selector:
        datetime:
      name: Resume at
      description: Optional. Local date and time when the rule should resume.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

resume_rule:
  name: Resume rule
  description: Resume a managed Firewalla rule immediately.
  fields:
    rule_target:
      required: true
      example: "761"
      selector:
        text:
      name: Rule target
      description: Use the Rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

set_ssid_paused:
  name: Set SSID paused
  description: Pause or resume one AP7 wireless network (SSID profile). Uses the confirmed local write contract to toggle the wireless network across all AP7 access points.
  fields:
    ssid_profile_id:
      required: true
      example: "f185dc47-2730-48a8-844c-b57aa31af4ba"
      selector:
        text:
      name: SSID profile
      description: The UUID or SSID name of the wireless network to toggle. Get the list from the get_wireless_status service.
    enabled:
      required: true
      example: true
      selector:
        boolean:
      name: Enabled
      description: Set to true to enable (unpause) the wireless network, or false to pause it.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_alarms:
  name: Get alarms
  description: Return the newest active alarms and optionally archived alarms with normalized details, silence records, and shared report metadata. The box retains roughly 30 days and provides no time-window or cursor filter.
  fields:
    limit:
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 500
          mode: box
      name: Limit
      description: Optional. Defaults to 10. Return the newest matching alarms, up to 500.
    include_archived:
      required: false
      example: false
      selector:
        boolean:
      name: Include archived
      description: Optional. Include archived alarm records.
    type:
      required: false
      example: "security"
      selector:
        text:
      name: Alarm type
      description: Optional raw ALARM_* type or supported group security, abnormal_upload, or open_port.
    detail:
      required: false
      example: false
      selector:
        boolean:
      name: Fetch detail
      description: Optional. Fetch extended detail with one additional request per returned alarm.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if names are unique. If names repeat, use Config Entry ID.

get_rules:
  name: Get rules
  description: Return the current live policy rules as a flat, selectable list with rule id, action, enabled and paused state, target, scope, applies_to, tag_refs, purpose, and any originating alarm. Defaults to user-visible rules; product-owned DAP and family rules are hidden unless requested via include_purpose. Use this to resolve the rule target for pause_rule and resume_rule.
  fields:
    enabled:
      required: false
      example: true
      selector:
        boolean:
      name: Enabled
      description: Optional. Filter by enabled state.
    action:
      required: false
      example: "block"
      selector:
        select:
          options:
            - value: "block"
              label: Block
            - value: "allow"
              label: Allow
            - value: "qos"
              label: QoS
            - value: "disturb"
              label: Disturb
      name: Action
      description: Optional. Filter by rule action.
    target_type:
      required: false
      example: "category"
      selector:
        text:
      name: Target type
      description: Optional. Filter by target type, for example category, mac, ip, dns or network.
    applies_to:
      required: false
      example: "KADEN's Devices"
      selector:
        text:
      name: Applies to
      description: Optional. Filter to rules governing one group, user or network name.
    include_purpose:
      required: false
      example: "dap"
      selector:
        select:
          multiple: true
          options:
            - value: "dap"
              label: Device Active Protect rules
            - value: "family"
              label: Family rules
      name: Include purpose
      description: Optional. Include product-owned rules that are hidden by default.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and their names are unique. If names repeat, use Config Entry ID.

sync_runtime:
  name: Sync runtime
  description: Poll the Firewalla box now and report the resulting snapshot time. Requests within the coordinator's debounce window are coalesced, so calling this alongside other actions still costs at most one poll.
  fields:
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and their names are unique. If names repeat, use Config Entry ID.

create_rule:
  name: Create rule
  description: Create a persistent block rule, optionally scoped to an alarm's target. Blocking a target from an alarm creates an ordinary policy rule that records the alarm id as a back-reference.
  fields:
    alarm_id:
      required: false
      example: "1728"
      selector:
        text:
      name: Alarm ID
      description: Optional. Build the block from an alarm's target and device scope, recording the alarm id on the new rule. Provide this or target_type and target_value.
    target_type:
      required: false
      example: "dns"
      selector:
        select:
          options:
            - value: "dns"
              label: Domain (DNS)
            - value: "ip"
              label: IP address
            - value: "mac"
              label: Device (MAC)
      name: Target type
      description: Optional. Required with target_value when alarm_id is omitted.
    target_value:
      required: false
      example: "vimeo.com"
      selector:
        text:
      name: Target value
      description: Optional. Required with target_type when alarm_id is omitted. The domain, IP, or MAC to block.
    scope_kind:
      required: false
      example: "device"
      selector:
        select:
          options:
            - value: "device"
              label: One device
            - value: "network"
              label: One network
            - value: "all"
              label: Everywhere
      name: Scope kind
      description: Optional. Where the rule applies. Defaults to everywhere when omitted.
    scope_target:
      required: false
      example: "0C:85:E1:B0:1D:1C"
      selector:
        text:
      name: Scope target
      description: Optional. The scope value for the chosen kind (a MAC for device, a network uuid for network).
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and their names are unique. If names repeat, use Config Entry ID.

archive_alarms:
  name: Archive alarms
  description: Archive one active alarm or all active alarms. Archived alarms remain retrievable.
  fields:
    mode:
      required: true
      example: "this"
      selector:
        select:
          options:
            - value: "this"
              label: One alarm
            - value: "all_active"
              label: All active alarms
      name: Mode
      description: Choose one alarm or the entire active set.
    alarm_id:
      required: false
      example: "1728"
      selector:
        text:
      name: Alarm ID
      description: Required when mode is this.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if setup names are unique. If names repeat, use Config Entry ID.

delete_alarms:
  name: Delete alarms
  description: Permanently delete one alarm or a selected active/archive set. This cannot be undone.
  fields:
    mode:
      required: true
      example: "this"
      selector:
        select:
          options:
            - value: "this"
              label: One alarm
            - value: "all_active"
              label: All active alarms
            - value: "all_archived"
              label: All archived alarms
      name: Mode
      description: Select which alarm set to permanently delete.
    alarm_id:
      required: false
      example: "1728"
      selector:
        text:
      name: Alarm ID
      description: Required when mode is this.
    confirm:
      required: true
      example: true
      selector:
        boolean:
      name: Confirm permanent deletion
      description: Set to true to acknowledge that deletion cannot be undone.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if setup names are unique. If names repeat, use Config Entry ID.

mute_alarm:
  name: Mute alarm
  description: Create a scoped silence for an alarm type, DNS domain, or IP address. Scope is explicit to prevent an accidental global mute.
  fields:
    alarm_id:
      required: false
      example: "1728"
      selector:
        text:
      name: Alarm ID (Optional)
      description: Use an alarm to infer an omitted target value where available.
    target_type:
      required: true
      example: "domain"
      selector:
        select:
          options:
            - value: "alarm_type"
              label: Alarm type
            - value: "domain"
              label: DNS domain
            - value: "ip"
              label: IP address
      name: Target type
      description: Choose the type of silence to create.
    target_value:
      required: false
      example: "example.com"
      selector:
        text:
      name: Target value
      description: Raw ALARM_* type, domain, or IP. May be inferred from alarm_id where available.
    scope_kind:
      required: true
      example: "device"
      selector:
        select:
          options:
            - value: "device"
              label: Device
            - value: "group"
              label: Group
            - value: "user"
              label: User
            - value: "network"
              label: Network
            - value: "all"
              label: All devices
      name: Scope kind
      description: Required. Choose all explicitly to create a box-wide silence.
    scope_target:
      required: false
      example: "00:11:22:33:44:55"
      selector:
        text:
      name: Scope target
      description: Required unless scope kind is all. Provide the target ID for the selected scope.
    duration:
      required: true
      example: "1h"
      selector:
        select:
          options:
            - value: "1h"
              label: One hour
            - value: "today"
              label: Until midnight in the Firewalla timezone
            - value: "always"
              label: Always
      name: Duration
      description: Choose how long the silence remains active.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if setup names are unique. If names repeat, use Config Entry ID.

unmute_alarm:
  name: Unmute alarm
  description: Remove a silence by exception ID or an alarm-linked silence by alarm ID. Provide exactly one identifier.
