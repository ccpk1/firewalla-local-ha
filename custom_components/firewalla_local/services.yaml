          min: 1
          max: 100
          mode: box
      name: Result limit
      description: Optional. Defaults to 1 so the service can easily return only the most recent result.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before reading results.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_time_usage_report:
  name: Get time usage report
  description: Return one normalized scoped time-usage report from the Firewalla local API.
  fields:
    scope_kind:
      required: true
      example: "device"
      selector:
        select:
          options:
            - "device"
            - "group"
            - "user"
      name: Scope kind
      description: Required. Choose whether the target is a device, group, or user.
    scope_target:
      required: true
      example: "EC:0D:51:CC:BA:BC"
      selector:
        text:
      name: Scope target
      description: Required. Use a stable ID or the current display label for the selected scope.
    begin:
      required: true
      example: "2026-03-20 00:00:00"
      selector:
        datetime:
      name: Begin
      description: Required. Local date and time for the beginning of the usage window.
    end:
      required: true
      example: "2026-03-27 00:00:00"
      selector:
        datetime:
      name: End
      description: Required. Local date and time for the end of the usage window.
    granularity:
      required: true
      example: "day"
      selector:
        select:
          options:
            - "day"
            - "hour"
      name: Granularity
      description: Required. Choose whether the primary report periods should be daily or hourly.
    sections:
      required: false
      example: "apps,categories"
      selector:
        select:
          multiple: true
          options:
            - value: "internet"
              label: Internet usage
            - value: "app_totals"
              label: App totals
            - value: "apps"
              label: Apps
            - value: "categories"
              label: Categories
      name: Sections
      description: Optional. Limit the report to the named major sections. When omitted, standard returns all major sections and summary returns internet plus app totals. A non-empty app filter also keeps the apps section visible.
    include:
      required: false
      example: "intervals"
      selector:
        select:
          multiple: true
          options:
            - value: "intervals"
              label: Device interval detail
      name: Include detail
      description: Optional. Add per-device interval detail when Firewalla returns it for the selected scope and apps.
    detail:
      required: false
      example: "standard"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary
            - value: "standard"
              label: Standard
      name: Detail
      description: Optional. Defaults to standard. Summary returns the smallest default section set, while standard returns the normal report depth.
    app_ids:
      required: false
      example: "internet,facebook"
      selector:
        text:
      name: App IDs
      description: Optional. Provide a comma-separated list in the UI, or a list in YAML. Omit this field to return all available app sections. A non-empty list also keeps the apps section in the response.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_wan_data_usage:
  name: Get WAN data usage
  description: Return one normalized WAN data-usage report with current and history month, week, and day sections.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter results to one WAN UUID.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter results to one WAN display name.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before reading current WAN data.
    current_periods:
      required: false
      example: "month"
      selector:
        select:
          multiple: true
          options:
            - value: "month"
              label: Current month
            - value: "week"
              label: Current week
            - value: "day"
              label: Current day
      name: Current periods
      description: Optional. Defaults to current month unless you request only history.
    history_period:
      required: false
      example: "month"
      selector:
        select:
          options:
            - value: "month"
              label: Months
            - value: "week"
              label: Weeks
            - value: "day"
              label: Days
      name: History period
      description: Optional. Required when history count is greater than zero.
    history_count:
      required: false
      example: 3
      selector:
        number:
          min: 0
          max: 366
      name: History count
      description: Optional. Number of full history periods to include. Defaults to 0. Historical periods are always full periods.
    include:
      required: false
      example: "subperiods"
      selector:
        select:
          multiple: true
          options:
            - value: "history"
              label: History rows
            - value: "subperiods"
              label: Nested subperiod breakdowns
      name: Include sections
      description: Optional. Add history rows or nested subperiod breakdowns where the selected periods support them.
    detail:
      required: false
      example: "summary"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary
            - value: "full"
              label: Full
      name: Detail
      description: Optional. Defaults to summary. Use full only when you want nested subperiod breakdowns where the selected periods support them.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_wan_events:
  name: Get WAN events
  description: Return normalized WAN health timeline events from the Firewalla local API.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter events to one WAN UUID when the event applies to that WAN.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter events to one WAN display name.
    limit:
      required: false
      example: 100
      selector:
        number:
          min: 1
          max: 500
          mode: box
      name: Event limit
      description: Optional. Defaults to 100. Firewalla app captures confirmed paged reads through limit_count.
    offset:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 5000
          mode: box
      name: Event offset
      description: Optional. Defaults to 0 so you can page older events.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

pause_rule:
  name: Pause rule
  description: Pause a managed Firewalla rule. Provide either a duration or a resume time. If you provide neither, the rule stays paused until resumed.
  fields:
    rule_target:
      required: true
      example: "761"
      selector:
        text:
      name: Rule target
      description: Use the Rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
    duration:
      required: false
      example: "30m"
      selector:
        text:
      name: Duration
      description: Optional. How long to pause the rule, for example 30m, 4h, or 2d 4h 30m.
    resume_at:
      required: false
      example: "2026-03-24 18:30:00"
      selector:
        datetime:
      name: Resume at
      description: Optional. Local date and time when the rule should resume.

resume_rule:
  name: Resume rule
  description: Resume a managed Firewalla rule immediately.
  fields:
    rule_target:
      required: true
      example: "761"
      selector:
        text:
      name: Rule target
      description: Use the Rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
