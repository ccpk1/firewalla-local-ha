get_runtime_inventory:
  name: Get rule and runtime inventory
  description: Return the current Firewalla rule, group, user, and related runtime inventory as structured data plus a markdown summary.
  fields:
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_hosts:
  name: Get hosts
  description: Return the Firewalla host (device) records with naming fields, IP address, device type, kind, group membership, and online state. Filters narrow the result on the box. Non-admin; for the full runtime inventory use get_runtime_inventory.
  fields:
    detail:
      required: false
      example: "summary"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary (omits derivable and unreliable fields)
            - value: "full"
              label: Full record
      name: Detail
      description: Optional. 'summary' (default) omits the derivable dns_fqdn, the unreliable dhcp_name, and the nested ip_assignment, flattening its useful parts to ip_assignment_mode and reserved_ipv4. Use 'full' for the complete record.
    host_name:
      required: false
      example: "living-room-tv"
      selector:
        text:
      name: Host name
      description: Optional. Substring match on the host name. Use it to find one device instead of listing every host.
    host_mac:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
      name: Host MAC
      description: Optional. Exact host MAC address.
    group_name:
      required: false
      example: "Guest Devices"
      selector:
        text:
      name: Group name
      description: Optional. Exact group or user name to filter by. Matches exactly, so filter one name at a time.
    kind:
      required: false
      example: "mac_host"
      selector:
        select:
          options:
            - value: "mac_host"
              label: A normal MAC-backed device
            - value: "pseudo_host"
              label: A VPN peer (no MAC)
      name: Kind
      description: Optional. 'mac_host' for a normal device, 'pseudo_host' to return only VPN peers. Peers have no MAC address, so they cannot be used with host actions that take one.
    network_uuid:
      required: false
      example: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
      selector:
        text:
      name: Network UUID
      description: Optional. Filter to the devices on one network.
    online:
      required: false
      example: true
      selector:
        boolean:
      name: Online
      description: Optional. Filter by connectivity. Uses the same activity-window definition as the device counts on the system-status sensor.
    user:
      required: false
      example: "12"
      selector:
        text:
      name: User ID
      description: Optional. Filter to hosts belonging to one user id.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before building the host records.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_network_segment_report:
  name: Get network segment report
  description: Return one configuration-oriented network segment report in the shared report envelope from the Firewalla local API.
  fields:
    network_uuid:
      required: false
      example: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
      selector:
        text:
      name: Network UUID
      description: Required unless you provide network name. Use the Firewalla network UUID for deterministic automations.
    network_name:
      required: false
      example: "Guest VLAN"
      selector:
        text:
      name: Network name
      description: Required unless you provide network UUID. Use the current Firewalla network display name for interactive use.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the network selector and building the report.
    include:
      required: false
      example: "hosts"
      selector:
        select:
          multiple: true
          options:
            - value: "hosts"
              label: Include the devices on this network
      name: Include
      description: Optional. Add the network's device list. Absent by default because those rows carry MAC addresses, hostnames, IPs, and reservations; ask for it only when the devices are wanted.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_flow_report:
  name: Get flow report
  description: Return one flow report for a device, group, or user in the shared report envelope from the Firewalla local API.
  fields:
    host_mac:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
      name: Host MAC
      description: Optional. Scope the report to a host by MAC. Provide exactly one scope selector.
    host_name:
      required: false
      example: "Living Room TV"
      selector:
        text:
      name: Host name
      description: Optional. Scope the report to a host by name. Provide exactly one scope selector.
    group_id:
      required: false
      example: "53"
      selector:
        text:
      name: Group ID
      description: Optional. Scope the report to a group by id. Provide exactly one scope selector.
    group_name:
      required: false
      example: "Guest Devices"
      selector:
        text:
      name: Group name
      description: Optional. Scope the report to a group by name. Provide exactly one scope selector.
    user_id:
      required: false
      example: "63"
      selector:
        text:
      name: User ID
      description: Optional. Scope the report to a user by id. Provide exactly one scope selector.
    user_name:
      required: false
      example: "KADEN"
      selector:
        text:
      name: User name
      description: Optional. Scope the report to a user by name. Provide exactly one scope selector.
    window_hours:
      required: false
      example: 24
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: hours
      name: Window hours (Optional)
      description: Optional. Defaults to 24, which is the window Firewalla itself serves. Firewalla retains about 24 hours of flow data and quietly serves that much for a wider request, so read window_is_clamped and window_hours_served in the response rather than assuming the window you asked for.
    detail:
      required: false
      example: "summary"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary only
            - value: "full"
              label: Summary and flow records
      name: Detail (Optional)
      description: Optional. Defaults to summary, which is one request. Full adds the blocked and regular flow records, which are separate reads of several thousand rows on a busy target.
    record_count:
      required: false
      example: 300
      selector:
        number:
          min: 50
          max: 5000
          mode: box
      name: Record count (Optional)
      description: Optional. Defaults to 300. The page size for a records read. Firewalla caps one response at 5000 records and needs pagination beyond that, so ask for everything with Fetch all records rather than a larger count.
    fetch_all_records:
      required: false
      example: false
      selector:
        boolean:
      name: Fetch all records (Optional)
      description: Optional. Defaults to false. Walk the record cursor until Firewalla stops returning more, instead of fetching one page. A walk that hits its deadline reports truncated true with a cursor, so a partial result is never mistaken for a complete one.
    include:
      required: false
      example: "host_detail"
      selector:
        select:
          multiple: true
          options:
            - value: "host_detail"
              label: Include the device behind each member, destination, and record
      name: Include
      description: Optional. Add the device identifiers you did not yourself name — the member ranking, each destination's device IDs, and each record's device ID and address. Absent by default because a group report would otherwise carry the household's device inventory. Destination hostnames and addresses are always returned, and a device scope needs no flag, since it names nothing beyond the device you asked for.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the scope and building the report. The flow data itself is always read live.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_network_segment_usage:
  name: Get network segment usage
  description: Return one window-selected usage-oriented network segment report in the shared report envelope from the Firewalla local API.
  fields:
    network_uuid:
      required: false
      example: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
      selector:
        text:
      name: Network UUID
      description: Optional. Use the Firewalla network UUID for deterministic automations. If omitted for a static reservation, the integration will try to infer the network from the reserved IPv4 address.
    network_name:
      required: false
      example: "Guest VLAN"
      selector:
        text:
      name: Network name
      description: Optional. Use the current Firewalla network display name for interactive use. If omitted for a static reservation, the integration will try to infer the network from the reserved IPv4 address.
    window:
      required: true
      example: "last_24_hours"
      selector:
        select:
          options:
            - value: "last_60_minutes"
              label: Last 60 minutes
            - value: "last_24_hours"
              label: Last 24 hours
            - value: "last_30_days"
              label: Last 30 days
            - value: "last_12_months"
              label: Last 12 months
      name: Window
      description: Required. Choose the primary activity window to report.
    top_n:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 100
          mode: box
      name: Top N rankings
      description: Optional. Defaults to 5. Limit how many top device, app, category, upload, and download ranking rows the report returns.
    include:
      required: false
      example: "series"
      selector:
        select:
          multiple: true
          options:
            - value: "series"
              label: Raw metric samples
      name: Include sections
      description: Optional. Add raw metric sample sections for the selected window. The default report already includes selected-window summaries plus activity-derived devices, apps, and categories when Firewalla exposes them.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the network selector and building the report.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

