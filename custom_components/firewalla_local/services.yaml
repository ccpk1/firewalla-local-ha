      selector:
        text:
      name: Host MAC
      description: Required. One or more Firewalla host MACs to permanently delete. Provide multiple values as a comma-separated list.
    confirm:
      required: true
      example: true
      selector:
        boolean:
      name: Confirm
      description: Required. Must be set to true to acknowledge this destructive action permanently removes the device.
    refresh:
