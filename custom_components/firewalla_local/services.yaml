get_runtime_inventory:
  name: Get runtime inventory
  description: Return the current Firewalla runtime objects as markdown and structured data.
  fields:
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_network_interfaces:
  name: Get network interfaces
  description: Return normalized network-segment interface summaries from the Firewalla local API.
  fields:
    network_uuid:
      required: false
      example: "5799d896-5e0f-40a5-a776-38a5d7746204"
      selector:
        text:
      name: Network UUID
      description: Optional. Filter results to one network UUID for deterministic automations.
    network_name:
      required: false
      example: "VLAN10 CORE"
      selector:
        text:
      name: Network name
      description: Optional. Filter results to one Firewalla network display name.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving network selectors.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

run_internet_speed_test:
  name: Run internet speed test
  description: Start an internet speed test on one Firewalla WAN interface.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Use the Firewalla WAN UUID for deterministic automations.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Use the WAN display name shown by Firewalla. If only one WAN is available, you can omit both WAN selectors.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_speed_test_results:
  name: Get speed test results
  description: Return normalized Firewalla internet speed test results from the coordinator refresh path.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter results to one WAN UUID.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter results to one WAN display name.
    limit:
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
      name: Result limit
      description: Optional. Defaults to 1 so the service can easily return only the most recent result.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before reading results.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_usage_history:
  name: Get usage history
  description: Return normalized scoped usage history from the Firewalla local API.
  fields:
    scope_kind:
      required: true
      example: "device"
      selector:
        select:
          options:
            - "device"
            - "group"
            - "user"
      name: Scope kind
      description: Required. Choose whether the target is a device, group, or user.
    scope_target:
      required: true
      example: "EC:0D:51:CC:BA:BC"
      selector:
        text:
      name: Scope target
      description: Required. Use a stable ID or the current display label for the selected scope.
    begin:
      required: true
      example: "2026-03-20 00:00:00"
      selector:
        datetime:
      name: Begin
      description: Required. Local date and time for the beginning of the usage window.
    end:
      required: true
      example: "2026-03-27 00:00:00"
      selector:
        datetime:
      name: End
      description: Required. Local date and time for the end of the usage window.
    granularity:
      required: true
      example: "day"
      selector:
        select:
          options:
            - "day"
            - "hour"
      name: Granularity
      description: Required. Day and hour are the currently proven slot-based granularities.
    app_ids:
      required: false
      example: "internet,facebook"
      selector:
        text:
      name: App IDs
      description: Optional. Provide a comma-separated list in the UI, or a list in YAML. Omit this field to return all available app buckets.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_wan_data_usage:
  name: Get WAN data usage
  description: Return one normalized WAN data-usage report with current and history month, week, and day sections.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter results to one WAN UUID.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter results to one WAN display name.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before reading current WAN data.
    current_periods:
      required: false
      example: "month"
      selector:
        select:
          multiple: true
          options:
            - value: "month"
              label: Current month
            - value: "week"
              label: Current week
            - value: "day"
              label: Current day
      name: Current periods
      description: Optional. Defaults to current month unless you request only history.
    history_period:
      required: false
      example: "month"
      selector:
        select:
          options:
            - value: "month"
              label: Months
            - value: "week"
              label: Weeks
            - value: "day"
              label: Days
      name: History period
      description: Optional. Required when history count is greater than zero.
    history_count:
      required: false
      example: 3
      selector:
        number:
          min: 0
          max: 366
      name: History count
      description: Optional. Number of full history periods to include. Defaults to 0. Historical periods are always full periods.
    detail:
      required: false
      example: "summary"
      selector:
        select:
          options:
            - value: "summary"
              label: Summary
            - value: "weekly"
              label: Weekly
            - value: "daily"
              label: Daily
      name: Detail
      description: Optional. Defaults to summary. Use weekly or daily to add derived nested breakdown rows where that richer detail is supported.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_wan_events:
  name: Get WAN events
  description: Return normalized WAN health timeline events from the Firewalla local API.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter events to one WAN UUID when the event applies to that WAN.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter events to one WAN display name.
    limit:
      required: false
      example: 100
      selector:
        number:
          min: 1
          max: 500
          mode: box
      name: Event limit
      description: Optional. Defaults to 100. Firewalla app captures confirmed paged reads through limit_count.
    offset:
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 5000
          mode: box
      name: Event offset
      description: Optional. Defaults to 0 so you can page older events.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

pause_rule:
  name: Pause rule
  description: Pause a managed Firewalla rule. Provide either a duration or a resume time. If you provide neither, the rule stays paused until resumed.
  fields:
    rule_target:
      required: true
      example: "761"
      selector:
        text:
      name: Rule target
      description: Use the Rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
    duration:
      required: false
      example: "30m"
      selector:
        text:
      name: Duration
      description: Optional. How long to pause the rule, for example 30m, 4h, or 2d 4h 30m.
    resume_at:
      required: false
      example: "2026-03-24 18:30:00"
      selector:
        datetime:
      name: Resume at
      description: Optional. Local date and time when the rule should resume.

resume_rule:
  name: Resume rule
  description: Resume a managed Firewalla rule immediately.
  fields:
    rule_target:
      required: true
      example: "761"
      selector:
        text:
      name: Rule target
      description: Use the Rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
