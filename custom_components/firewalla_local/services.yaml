get_runtime_inventory:
  name: Get rule and runtime inventory
  description: Return the current Firewalla rule, group, user, and related runtime inventory as structured data plus a markdown summary.
  fields:
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_network_segment_report:
  name: Get network segment report
  description: Return one configuration-oriented network segment report in the shared report envelope from the Firewalla local API.
  fields:
    network_uuid:
      required: false
      example: "5799d896-5e0f-40a5-a776-38a5d7746204"
      selector:
        text:
      name: Network UUID
      description: Required unless you provide network name. Use the Firewalla network UUID for deterministic automations.
    network_name:
      required: false
      example: "VLAN10 CORE"
      selector:
        text:
      name: Network name
      description: Required unless you provide network UUID. Use the current Firewalla network display name for interactive use.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the network selector and building the report.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_network_segment_usage:
  name: Get network segment usage
  description: Return one window-selected usage-oriented network segment report in the shared report envelope from the Firewalla local API.
  fields:
    network_uuid:
      required: false
      example: "5799d896-5e0f-40a5-a776-38a5d7746204"
      selector:
        text:
      name: Network UUID
      description: Required unless you provide network name. Use the Firewalla network UUID for deterministic automations.
    network_name:
      required: false
      example: "VLAN10 CORE"
      selector:
        text:
      name: Network name
      description: Required unless you provide network UUID. Use the current Firewalla network display name for interactive use.
    window:
      required: true
      example: "last_24_hours"
      selector:
        select:
          options:
            - value: "last_60_minutes"
              label: Last 60 minutes
            - value: "last_24_hours"
              label: Last 24 hours
            - value: "last_30_days"
              label: Last 30 days
            - value: "last_12_months"
              label: Last 12 months
      name: Window
      description: Required. Choose the primary activity window to report.
    top_n:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 100
          mode: box
      name: Top N rankings
      description: Optional. Defaults to 5. Limit how many top device, app, category, upload, and download ranking rows the report returns.
    include:
      required: false
      example: "series"
      selector:
        select:
          multiple: true
          options:
            - value: "series"
              label: Raw metric samples
      name: Include sections
      description: Optional. Add raw metric sample sections for the selected window. The default report already includes selected-window summaries plus activity-derived devices, apps, and categories when Firewalla exposes them.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the network selector and building the report.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

run_internet_speed_test:
  name: Run internet speed test
  description: Start an internet speed test on one Firewalla WAN interface.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Use the Firewalla WAN UUID for deterministic automations.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Use the WAN display name shown by Firewalla. If only one WAN is available, you can omit both WAN selectors.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

wake_host:
  name: Wake host
  description: Send a Wake-on-LAN command to one Firewalla host.
  fields:
    host_mac:
      required: false
      example: "00:AA:BB:CC:DD:26"
      selector:
        text:
      name: Host MAC
      description: Optional. Use the Firewalla host MAC for deterministic automations.
    host_name:
      required: false
      example: "Plex Server"
      selector:
        text:
      name: Host name
      description: Optional. Use the current Firewalla host display name or full host label, such as Plex Server (192.168.10.10), for interactive use.
    host_id:
      required: false
      example: "00:AA:BB:CC:DD:26"
      selector:
        text:
      name: Host ID
      description: Optional. Alternate host identity selector. It currently resolves to the same normalized Firewalla host identity as the host MAC.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the host selector and sending the Wake-on-LAN command.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

get_speed_test_results:
  name: Get speed test results
  description: Return normalized Firewalla internet speed test results from the coordinator refresh path.
  fields:
    wan_uuid:
      required: false
      example: "c28e3135-0f97-4a6e-8c78-a929a82d47f3"
      selector:
        text:
      name: WAN UUID
      description: Optional. Filter results to one WAN UUID.
    wan_name:
      required: false
      example: "WAN-ONE"
      selector:
        text:
      name: WAN name
      description: Optional. Filter results to one WAN display name.
