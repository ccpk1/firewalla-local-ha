      selector:
        text:
      name: Host ID
      description: Optional. Alternate host identity selector. It currently resolves to the same normalized Firewalla host identity as the host MAC.
    network_uuid:
      required: false
      example: "5799d896-5e0f-40a5-a776-38a5d7746204"
      selector:
        text:
      name: Network UUID
      description: Required unless you provide network name. Use the Firewalla network UUID for deterministic automations.
    network_name:
      required: false
      example: "VLAN10 CORE"
      selector:
        text:
      name: Network name
      description: Required unless you provide network UUID. Use the current Firewalla network display name for interactive use.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the host and network selectors, validating the requested reservation, and sending the reservation change.
