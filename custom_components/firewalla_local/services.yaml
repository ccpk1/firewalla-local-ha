    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and their names are unique. If names repeat, use Config Entry ID.

get_system_overview:
  name: Get system overview
  description: Return a curated system summary — appliance health, network identities with per-network device counts, and counts for devices, VPN peers, groups, users, rules, and alarms, plus per-WAN speed-test and quality metrics. Counts and identities only, never record collections. Group and user names and ids are only included when requested via include.
  fields:
    include:
      required: false
      example: "identifiers"
      selector:
        select:
          multiple: true
          options:
            - value: "identifiers"
              label: Group and user names and ids
      name: Include
      description: Optional. Add the group and user names and ids that other tools accept as selectors. Omitted by default so the summary discloses no person-level data.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and their names are unique. If names repeat, use Config Entry ID.

sync_runtime:
  name: Sync runtime
  description: Poll the Firewalla box now and report the resulting snapshot time. Requests within the coordinator's debounce window are coalesced, so calling this alongside other actions still costs at most one poll.
  fields:
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and their names are unique. If names repeat, use Config Entry ID.

create_rule:
  name: Create rule
  description: Create a persistent block rule, optionally scoped to an alarm's target. Blocking a target from an alarm creates an ordinary policy rule that records the alarm id as a back-reference.
  fields:
    alarm_id:
      required: false
      example: "1001"
      selector:
        text:
      name: Alarm ID
      description: Optional. Build the block from an alarm's target and device scope, recording the alarm id on the new rule. Provide this or target_type and target_value.
    target_type:
      required: false
      example: "dns"
      selector:
        select:
          options:
            - value: "dns"
              label: Domain (DNS)
            - value: "ip"
              label: IP address
            - value: "mac"
              label: Device (MAC)
      name: Target type
      description: Optional. Required with target_value when alarm_id is omitted.
    target_value:
      required: false
      example: "vimeo.com"
      selector:
        text:
      name: Target value
      description: Optional. Required with target_type when alarm_id is omitted. The domain, IP, or MAC to block.
    host_mac:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
      name: Host MAC
      description: Optional. Apply the rule to this host, by MAC. Provide exactly one scope selector.
    host_name:
      required: false
      example: "Living Room TV"
      selector:
        text:
      name: Host name
      description: Optional. Apply the rule to this host, by name. Provide exactly one scope selector.
    group_id:
      required: false
      example: "53"
      selector:
        text:
      name: Group ID
      description: Optional. Apply the rule to this group, by id. Provide exactly one scope selector.
    group_name:
      required: false
      example: "Guest Devices"
      selector:
        text:
      name: Group name
      description: Optional. Apply the rule to this group, by name. Provide exactly one scope selector.
    user_id:
      required: false
      example: "63"
      selector:
        text:
      name: User ID
      description: Optional. Apply the rule to this user, by id. Provide exactly one scope selector.
    user_name:
      required: false
      example: "KADEN"
      selector:
        text:
      name: User name
      description: Optional. Apply the rule to this user, by name. Provide exactly one scope selector.
    network_uuid:
      required: false
      example: "5799d896-5e0f-40a5-a776-38a5d7746204"
      selector:
        text:
      name: Network UUID
      description: Optional. Apply the rule to this network, by UUID. Provide exactly one scope selector.
    network_name:
      required: false
      example: "VLAN10 CORE"
      selector:
        text:
      name: Network name
      description: Optional. Apply the rule to this network, by name. Provide exactly one scope selector.
    all_hosts:
      required: false
      example: false
      selector:
        boolean:
      name: All hosts
      description: Optional. Apply the rule to every host. The wide scope must be stated, because on the wire an empty scope means every host.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and their names are unique. If names repeat, use Config Entry ID.

archive_alarms:
  name: Archive alarms
  description: Archive one alarm or the whole active set. Archived alarms remain retrievable.
  fields:
    alarm_id:
      required: false
      example: "1001"
      selector:
        text:
      name: Alarm ID (Optional)
      description: Archive one alarm. Provide exactly one of Alarm ID or Alarm status.
    alarm_status:
      required: false
      example: "active"
      selector:
        select:
          options:
            - value: "active"
              label: The active set
      name: Alarm status (Optional)
      description: Archive the whole set. Only active, since an already-archived alarm has nothing left to archive. Provide exactly one of Alarm ID or Alarm status.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if setup names are unique. If names repeat, use Config Entry ID.

delete_alarms:
  name: Delete alarms
  description: Permanently delete one alarm or a whole set. This cannot be undone.
  fields:
    alarm_id:
      required: false
      example: "1001"
      selector:
        text:
      name: Alarm ID (Optional)
      description: Delete one alarm. Provide exactly one of Alarm ID or Alarm status.
    alarm_status:
      required: false
      example: "active"
      selector:
        select:
          options:
            - value: "active"
              label: The active set
            - value: "archived"
              label: The archived set
      name: Alarm status (Optional)
      description: Delete the active or archived set. Provide exactly one of Alarm ID or Alarm status.
    confirm:
      required: true
      example: true
      selector:
        boolean:
      name: Confirm permanent deletion
      description: Set to true to acknowledge that deletion cannot be undone.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if setup names are unique. If names repeat, use Config Entry ID.

mute_alarm:
  name: Mute alarm
  description: Create a scoped silence for an alarm type, DNS domain, or IP address. Scope is explicit to prevent an accidental global mute.
  fields:
    alarm_id:
      required: false
      example: "1001"
      selector:
        text:
      name: Alarm ID (Optional)
      description: Use an alarm to infer an omitted target value where available.
    alarm_target_type:
      required: true
      example: "domain"
      selector:
        select:
          options:
            - value: "alarm_type"
              label: Alarm type
            - value: "domain"
              label: DNS domain
            - value: "ip"
              label: IP address
      name: Alarm target type
      description: Choose what the silence targets.
    alarm_target_value:
      required: false
      example: "example.com"
      selector:
        text:
      name: Alarm target value
      description: Raw ALARM_* type, domain, or IP. May be inferred from alarm_id where available.
    host_mac:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
      name: Host MAC
      description: Optional. Silence for this host, by MAC. Provide exactly one scope selector.
    host_name:
      required: false
      example: "Living Room TV"
      selector:
        text:
      name: Host name
      description: Optional. Silence for this host, by name. Provide exactly one scope selector.
    group_id:
      required: false
      example: "53"
      selector:
        text:
      name: Group ID
      description: Optional. Silence for this group, by id. Provide exactly one scope selector.
    group_name:
      required: false
      example: "Guest Devices"
      selector:
        text:
      name: Group name
      description: Optional. Silence for this group, by name. Provide exactly one scope selector.
    user_id:
      required: false
      example: "63"
      selector:
        text:
      name: User ID
      description: Optional. Silence for this user, by id. Provide exactly one scope selector.
    user_name:
      required: false
      example: "KADEN"
      selector:
        text:
      name: User name
      description: Optional. Silence for this user, by name. Provide exactly one scope selector.
    network_uuid:
      required: false
      example: "5799d896-5e0f-40a5-a776-38a5d7746204"
      selector:
        text:
      name: Network UUID
      description: Optional. Silence for this network, by UUID. Provide exactly one scope selector.
    network_name:
      required: false
      example: "VLAN10 CORE"
      selector:
        text:
      name: Network name
      description: Optional. Silence for this network, by name. Provide exactly one scope selector.
    all_hosts:
      required: false
      example: false
      selector:
        boolean:
      name: All hosts
      description: Optional. Silence for every host. The box-wide case must be stated, because on the wire an empty scope means every host.
    duration:
      required: true
      example: "1h"
      selector:
        select:
          options:
            - value: "1h"
              label: One hour
            - value: "today"
              label: Until midnight in the Firewalla timezone
            - value: "always"
              label: Always
      name: Duration
      description: Choose how long the silence remains active.
    config_entry_id:
      required: false
