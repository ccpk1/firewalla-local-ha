set_host_dhcp_reservation:
  name: Set host DHCP reservation
  description: Set or clear one host-scoped DHCP reservation on one Firewalla network.
  fields:
    mode:
      required: true
      example: "static"
      selector:
        select:
          options:
            - value: "dynamic"
              label: Dynamic
            - value: "static"
              label: Static
      name: Reservation mode
      description: Required. Choose static to reserve an IPv4 address for the selected host on the selected network, or dynamic to clear the reservation.
    reserved_ipv4:
      required: false
      example: "192.168.1.50"
      selector:
        text:
      name: Reserved IPv4
      description: Optional. Required when mode is static. The address must belong to the selected network's IPv4 subnet. Omit it when mode is dynamic.
    host_mac:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
      name: Host MAC
      description: Optional. Use the Firewalla host MAC for deterministic automations.
    host_name:
      required: false
      example: "Living Room TV"
      selector:
        text:
      name: Host name
      description: Optional. Use the current Firewalla host display name or full host label, such as Living Room TV (192.168.1.50), for interactive use.
    host_id:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
      name: Host ID
      description: Optional. Alternate host identity selector. It currently resolves to the same normalized Firewalla host identity as the host MAC.
    network_uuid:
      required: false
      example: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
      selector:
        text:
      name: Network UUID
      description: Required unless you provide network name. Use the Firewalla network UUID for deterministic automations.
    network_name:
      required: false
      example: "Guest VLAN"
      selector:
        text:
      name: Network name
      description: Required unless you provide network UUID. Use the current Firewalla network display name for interactive use.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the host and network selectors, validating the requested reservation, and sending the reservation change.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

set_host_membership:
  name: Set host membership
  description: Set or clear the single group or user a device belongs to on the Firewalla box. DESTRUCTIVE - assigning a device to a group or a user permanently DELETES THE RULES ATTACHED TO THAT DEVICE, including enabled rules you created, and they cannot be restored. Rules attached to groups or users are NOT affected, including the user this device is leaving. This matches the Firewalla app, which warns about it when you assign a device.
  fields:
    group_name:
      required: false
      example: "Guest Devices"
      selector:
        text:
      name: Group name
      description: Optional. Assign the device to this group. Provide this or group id, and nothing else unless you are clearing. Group names are matched against groups only, never against users. Permanently deletes the rules attached to this device; group and user rules are unaffected.
    group_id:
      required: false
      example: "4"
      selector:
        text:
      name: Group ID
      description: Optional. Assign the device to the group with this Firewalla tag id. Use this instead of group name when two groups share a name. Permanently deletes the rules attached to this device; group and user rules are unaffected.
    user_name:
      required: false
      example: "KIDS_DEVICES"
      selector:
        text:
      name: User name
      description: Optional. Assign the device to this Firewalla user. Provide this or user id, and nothing else unless you are clearing. User names are matched against users only, never against groups. Permanently deletes the rules attached to this device; group and user rules are unaffected.
    user_id:
      required: false
      example: "8"
      selector:
        text:
      name: User ID
      description: Optional. Assign the device to the user with this Firewalla user id. Use this instead of user name when two users share a name. Permanently deletes the rules attached to this device; group and user rules are unaffected.
    clear:
      required: false
      example: false
      selector:
        boolean:
      name: Clear membership
      description: Optional. Defaults to false. Set to true to remove the device's current group or user assignment. Cannot be combined with a group or user field. The rules attached to this device are permanently deleted here too, leaving it with no rules until you add some; group and user rules are unaffected.
    host_mac:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
      name: Host MAC
      description: Optional. Use the Firewalla host MAC for deterministic automations.
    host_name:
      required: false
      example: "Living Room TV"
      selector:
        text:
      name: Host name
      description: Optional. Use the current Firewalla host display name or full host label, such as Living Room TV (192.168.1.50), for interactive use.
    host_id:
      required: false
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
      name: Host ID
      description: Optional. Alternate host identity selector. It currently resolves to the same normalized Firewalla host identity as the host MAC.
    refresh:
      required: false
      example: true
      selector:
        boolean:
      name: Refresh first
      description: Optional. Defaults to true. Refresh the Firewalla runtime before resolving the host and membership selectors and sending the change.
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
      name: Config entry ID (Optional)
      description: Use this if you have more than one Firewalla setup. It targets one specific setup.
    config_entry_name:
      required: false
      example: "Firewalla (192.168.1.1)"
      selector:
        text:
      name: Config entry name (Optional)
      description: Use this if you have more than one Firewalla setup and they each have unique names. If names repeat, use Config Entry ID.

get_speed_test_results:
