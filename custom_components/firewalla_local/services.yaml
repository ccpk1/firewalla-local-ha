get_runtime_inventory:
  name: Get runtime inventory
  description: Return the current Firewalla runtime objects as markdown and structured data.
  fields:
    config_entry_id:
      required: false
      example: "0123456789abcdef"
      selector:
        text:
    config_entry_name:
      required: false
      example: "Firewalla (192.168.200.1)"
      selector:
        text:

pause_rule:
  name: Pause rule
  description: Pause a managed Firewalla rule. Provide either a duration or a resume time. If you provide neither, the rule stays paused until resumed.
  fields:
    rule_target:
      required: true
      example: "761"
      selector:
        text:
      name: Rule target
      description: Use the Rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
    duration:
      required: false
      example: "30m"
      selector:
        text:
      name: Duration
      description: Optional. How long to pause the rule, for example 30m, 4h, or 2d 4h 30m.
    resume_at:
      required: false
      example: "2026-03-24 18:30:00"
      selector:
        datetime:
      name: Resume at
      description: Optional. Local date and time when the rule should resume.

resume_rule:
  name: Resume rule
  description: Resume a managed Firewalla rule immediately.
  fields:
    rule_target:
      required: true
      example: "761"
      selector:
        text:
      name: Rule target
      description: Use the Rule ID shown on a Firewalla rule switch, or a selected rule ID from the runtime inventory.
