rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: Add branded assets before release.
  common-modules: done
  config-flow-test-coverage:
    status: todo
    comment: Expand coverage for reconfigure validation edges, reauth failure paths, and options-flow drift cases while keeping all auth coverage internal-only and fully mocked.
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions:
    status: todo
    comment: Publish user-facing installation steps covering local pairing, key generation, options flow behavior, and the initial sensor and switch surfaces.
  docs-removal-instructions:
    status: todo
    comment: Add removal instructions once the integration is installable by users.
  entity-event-setup:
    status: exempt
    comment: The switch platform is coordinator-based and does not subscribe to push events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: Config flow provisions credentials and verifies the local runtime before entry creation.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: Runtime inventory and pause_rule validate entry scope, duration, and rule targets with specific service errors.
  config-entry-unloading: done
  docs-data-update:
    status: todo
    comment: Document the runtime snapshot shape, polling behavior, and the no-local-cache storage contract in user-facing docs rather than only architecture notes.
  entity-unavailable: done
  log-when-unavailable:
    status: done
    comment: The coordinator logs one outage and one recovery event for local runtime polling failures.
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: Auth failures trigger Home Assistant reauth and the flow refreshes credentials from a new QR payload.
  reconfigure-flow: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: Add discovery if Firewalla supports a reliable discovery mechanism.
  entity-category:
    status: done
    comment: Diagnostic system-monitoring sensors use the diagnostic category while the rule-backed switch remains a primary control entity.
  entity-disabled-by-default:
    status: exempt
    comment: Entities are only created for rules the user explicitly selects in the options flow.
  entity-translations:
    status: done
    comment: Rule-backed switches and system-monitoring sensors use translation-backed names, states, and attributes without inline user-facing strings.
  exception-translations:
    status: done
    comment: Config flow and service validation now use distinct translation keys for host, QR, entry-scope, duration, and rule-target failures.
  icon-translations:
    status: done
    comment: Rule-backed switch icons and system-monitoring sensor icons are defined in icons.json instead of inline icon strings.
  stale-devices:
    status: exempt
    comment: The integration exposes one stable Firewalla device per config entry and does not dynamically remove devices.

  # Platinum
  async-dependency:
    status: done
    comment: The scaffold uses aiohttp and async coordinator patterns only.
  inject-websession: done
  strict-typing: done
