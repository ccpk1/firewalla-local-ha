rules:
  # Bronze
  action-setup:
    status: done
    comment: Service registration declares administrator-only actions centrally
      and re-registers them on setup so updated access gates cannot be masked by
      stale handlers.
  appropriate-polling: done
  brands:
    status: done
    comment: Custom integration brand assets are shipped in the integration package under brand/ per current Home Assistant guidance.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: Config-flow coverage now includes user cannot-connect handling, reauth failure and wrong-account paths, reconfigure validation, and options-flow drift behavior with all auth tests kept internal-only and fully mocked.
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: done
    comment: USER_GUIDE names every service in the catalog and documents the report services, including the flow report's window, detail levels, and what the host_detail include adds and why it is off by default.
  docs-high-level-description: done
  docs-installation-instructions:
    status: done
    comment: README and USER_GUIDE now document HACS installation, QR-based setup, options-flow management, and the current runtime surfaces.
  docs-removal-instructions:
    status: done
    comment: USER_GUIDE now documents config-entry removal and HACS repository removal.
  entity-event-setup:
    status: exempt
    comment: The switch platform is coordinator-based and does not subscribe to push events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: Config flow provisions credentials and verifies the local runtime before entry creation.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment:
      Runtime inventory, rule deletion, and alarm services validate entry scope,
      alarm/rule selectors, mute scope, and destructive confirmations with
      specific service errors.
      The report services validate their scope selectors as well. A device, group,
      or user that matches nothing raises flow_report_scope_not_found, and an
      ambiguous one raises flow_report_scope_ambiguous, each naming the scope kind
      and the selector the caller supplied. A report the box would not return
      raises flow_report_failed rather than returning a partial envelope.
      Mutating services and runtime inventory are administrator-only while
      automation calls without a user context remain supported.
  config-entry-unloading: done
  docs-data-update:
    status: done
    comment: USER_GUIDE now documents local polling, refresh cadence, optimistic updates, and the no-custom-cache runtime contract.
  entity-unavailable: done
  log-when-unavailable:
    status: done
    comment: The coordinator logs one outage and one recovery event for local runtime polling failures.
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: Auth failures trigger Home Assistant reauth and the flow refreshes credentials from a new QR payload.
  reconfigure-flow: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Auto-discovery (mDNS/DHCP) is omitted due to the firewall's stealth network defaults and generic MAC addresses; we instead leverage its native fire.walla DNS intercept for seamless setup.
  entity-category:
    status: done
    comment: "Primary rule, appliance-monitoring, alarm, watched-device, and watched-user entities remain uncategorized, with entity categories reserved for surfaces that are truly diagnostic."
  entity-disabled-by-default:
    status: done
    comment: "Rule-backed switches plus watched-device and watched-user entities are created only when the user selects them in options, while core appliance-monitoring and alarm entities remain always available."
  entity-translations:
    status: done
    comment: "Rule-backed switches, appliance-monitoring entities, alarm entities, watched-device entities, and watched-user entities use translation-backed names, states, and attributes without inline user-facing strings. Now enforced rather than asserted: two tests in test_vocabulary.py hold the published attribute set and the translated label set to each other in both directions, because this rule was marked done while seven attributes shipped unlabelled. Five had never had a label (dns_hostname, dns_domain, dns_fqdn, host_device_type, host_ip) and the other two were twins added without one; the ip_address to host_ip rename had also left a dead label behind, since a translation key is keyed by the attribute name and is not carried by a constant rename."
  exception-translations:
    status: done
    comment: Config flow and service validation now use distinct translation keys for host, QR, entry-scope, duration, and rule-target failures.
  icon-translations:
    status: done
    comment: "Rule-backed switch, appliance-monitoring, alarm, watched-device, and watched-user icons are defined in icons.json instead of inline icon strings."
  stale-devices:
    status: done
    comment: The integration reconciles tracked-client device-registry entries for selected device trackers, removing stale client devices when they are deselected or no longer owned by the config entry while retaining the primary Firewalla device per entry.

  # Platinum
  async-dependency:
    status: done
    comment: The scaffold uses aiohttp and async coordinator patterns only.
  inject-websession: done
  strict-typing: done
