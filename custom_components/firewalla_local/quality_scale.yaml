rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: done
    comment: Custom integration brand assets are shipped in the integration package under brand/ per current Home Assistant guidance.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: Config-flow coverage now includes user cannot-connect handling, reauth failure and wrong-account paths, reconfigure validation, and options-flow drift behavior with all auth tests kept internal-only and fully mocked.
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions:
    status: done
    comment: README and USER_GUIDE now document HACS installation, QR-based setup, options-flow management, and the current runtime surfaces.
  docs-removal-instructions:
    status: done
    comment: USER_GUIDE now documents config-entry removal and HACS repository removal.
  entity-event-setup:
    status: exempt
    comment: The switch platform is coordinator-based and does not subscribe to push events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: Config flow provisions credentials and verifies the local runtime before entry creation.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: Runtime inventory and pause_rule validate entry scope, duration, and rule targets with specific service errors.
  config-entry-unloading: done
  docs-data-update:
    status: done
    comment: USER_GUIDE now documents local polling, refresh cadence, optimistic updates, and the no-custom-cache runtime contract.
  entity-unavailable: done
  log-when-unavailable:
    status: done
    comment: The coordinator logs one outage and one recovery event for local runtime polling failures.
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: Auth failures trigger Home Assistant reauth and the flow refreshes credentials from a new QR payload.
  reconfigure-flow: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Auto-discovery (mDNS/DHCP) is omitted due to the firewall's stealth network defaults and generic MAC addresses; we instead leverage its native fire.walla DNS intercept for seamless setup.
  entity-category:
    status: done
    comment: "Primary rule, appliance-monitoring, watched-device, and watched-user entities remain uncategorized, with entity categories reserved for surfaces that are truly diagnostic."
  entity-disabled-by-default:
    status: done
    comment: "Rule-backed switches plus watched-device and watched-user entities are created only when the user selects them in options, while core appliance-monitoring entities remain always available."
  entity-translations:
    status: done
    comment: "Rule-backed switches, appliance-monitoring entities, watched-device entities, and watched-user entities use translation-backed names, states, and attributes without inline user-facing strings."
  exception-translations:
    status: done
    comment: Config flow and service validation now use distinct translation keys for host, QR, entry-scope, duration, and rule-target failures.
  icon-translations:
    status: done
    comment: "Rule-backed switch, appliance-monitoring, watched-device, and watched-user icons are defined in icons.json instead of inline icon strings."
  stale-devices:
    status: done
    comment: The integration reconciles tracked-client device-registry entries for selected device trackers, removing stale client devices when they are deselected or no longer owned by the config entry while retaining the primary Firewalla device per entry.

  # Platinum
  async-dependency:
    status: done
    comment: The scaffold uses aiohttp and async coordinator patterns only.
  inject-websession: done
  strict-typing: done
