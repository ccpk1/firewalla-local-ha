name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into manifest.json
        run: |
          cat <<< "$(jq --arg ver "${{ steps.tag.outputs.version }}" '.version = $ver' custom_components/firewalla_local/manifest.json)" > custom_components/firewalla_local/manifest.json

      - name: Create release archive
        run: |
          mkdir -p dist
          cp -r custom_components/firewalla_local dist/
          cd dist
          zip -r "firewalla_local-${{ steps.tag.outputs.version }}.zip" firewalla_local/

      - name: Check for prerelease
        id: prerelease
        run: |
          if [[ "${{ steps.tag.outputs.version }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ steps.prerelease.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "dist/firewalla_local-${{ steps.tag.outputs.version }}.zip"
