name: Build release artifacts

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into manifest.json
        run: |
          cat <<< "$(jq --arg ver "${{ steps.tag.outputs.version }}" '.version = $ver' custom_components/firewalla_local/manifest.json)" > custom_components/firewalla_local/manifest.json

      - name: Upload stamped manifest.json
        uses: actions/upload-artifact@v4
        with:
          name: manifest.json
          path: custom_components/firewalla_local/manifest.json

      - name: Create release archive
        run: |
          mkdir -p dist
          cp -r custom_components/firewalla_local dist/
          cd dist
          zip -r "firewalla_local-${{ steps.tag.outputs.version }}.zip" firewalla_local/

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: firewalla_local-${{ steps.tag.outputs.version }}
          path: dist/firewalla_local-${{ steps.tag.outputs.version }}.zip
