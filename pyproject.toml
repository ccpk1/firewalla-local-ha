[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-firewalla-local"
version = "2.5.0-beta.1"
description = "Local-first Home Assistant custom integration for Firewalla"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    # Home Assistant's `llm.async_call_tool` imports
    # `homeassistant.components.conversation` at call time, which imports
    # `hassil` and `gazetteer_matcher`. The `homeassistant` package does not
    # declare either, so every test that calls a tool fails with
    # ModuleNotFoundError without them. Pinned to the versions Home Assistant
    # constrains in `package_constraints.txt`.
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-homeassistant-custom-component>=0.13.218",
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting custom ClientSession.close attribute is discouraged:DeprecationWarning:homeassistant.helpers.aiohttp_client",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".tmp",
    ".captures",
    ".artifacts",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"custom_components/firewalla_local/device_tracker.py" = ["I001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["custom_components/firewalla_local"]

[[tool.mypy.overrides]]
module = "homeassistant.components.device_tracker"
ignore_errors = true

# Home Assistant 2026.10 replaced voluptuous with probatio and installs a
# runtime shim aliasing `voluptuous` to probatio, but mypy still resolves the
# real voluptuous package (pulled transitively). Their schema types are not
# identical, so skip analyzing voluptuous to avoid false arg-type errors.
# Runtime behavior is unaffected; this is version-agnostic.
[[tool.mypy.overrides]]
module = "voluptuous.*"
follow_imports = "skip"

# Home Assistant 2026.10 moved device-class enums into per-platform `const`
# modules and re-exports them from the package. Relax implicit-reexport checking
# for this one module so package-level imports keep working. Importing from
# `homeassistant.components.binary_sensor.const` would break older Core, where
# that module does not exist.
[[tool.mypy.overrides]]
module = "homeassistant.components.binary_sensor"
no_implicit_reexport = false

[tool.pylint.main]
ignore-paths = [
    "^\\.mypy_cache/.*$",
    "^\\.pytest_cache/.*$",
    "^\\.ruff_cache/.*$",
    "^\\.tmp/.*$",
    "^poc\\.py$",
]

[tool.pylint."messages control"]
disable = ["line-too-long"]
